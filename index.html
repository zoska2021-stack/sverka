  return html + `</div></div>`;
}
function openCandEdit(c){
  const w = document.createElement("div"); w.className = "sheetwrap";
  w.innerHTML = `<div class="sheet"><h2>Исправить распознанное</h2><div class="sub">Если документ прочитан неточно</div>
    <label class="field"><span>Сумма</span><input class="amount" inputmode="decimal" name="amount" value="${esc(String(c.amount ?? "").replace(".", ","))}"></label>
    <div class="two"><label class="field"><span>Дата</span><input type="date" name="date" value="${esc(c.date)}"></label>
    <label class="field"><span>Направление</span><select name="dir"><option value="in" ${c.dir === "in" ? "selected" : ""}>Приход</option><option value="out" ${c.dir === "out" ? "selected" : ""}>Расход</option></select></label></div>
    <label class="field"><span>${c.type === "check" ? "Отправитель" : "Контрагент"}</span><input name="name" value="${esc(c.name)}"></label>
    <label class="field"><span>ИНН</span><input inputmode="numeric" name="inn" value="${esc(c.inn)}"></label>
    <div class="actions"><button class="btn ghost" data-x="cancel">Отмена</button><button class="btn primary" data-x="save">Сохранить</button></div></div>`;
  document.body.appendChild(w);
  w.addEventListener("click", async e => {
    const x = e.target.dataset.x;
    if (e.target === w || x === "cancel") return w.remove();
    if (x !== "save") return;
    const g = n => w.querySelector(`[name="${n}"]`).value.trim();
    const a = parseMoney(g("amount")); if (!a){ toast("Укажите сумму"); return; }
    Object.assign(c, {amount: a, date: g("date"), dir: g("dir"), name: g("name"), inn: g("inn").replace(/\D/g, "")});
    if (c.type === "check") c.purpose = `${c.name || "?"} → ${c.recipient || "?"}`;
    await Store.set("cands", S.cands); w.remove(); render();
  });
}
async function handleDocs(files){
  for (const f of files){
    S.docBusy = `Читаю «${f.name}»…`; render();
    try{
      const r = await readDocument(f);
      const fileKey = uid(); S.files[fileKey] = {name: f.name, label: `${r.label || f.name}`};
      let added = 0;
      for (const o of r.ops){
        if (o.amount == null) continue;
        if (S.cands.find(c => c.date === o.date && Math.abs(c.amount - o.amount) < 0.005 && c.name === o.name && c.dir === o.dir)) continue;
        S.cands.push(Object.assign({id: uid(), fileKey, skipped: false}, o)); added++;
      }
      toast(added ? `«${f.name}»: найдено операций — ${added}` : `«${f.name}»: новых операций нет`);
    }catch(e){ console.error(e); toast(`«${f.name}»: ${e.message}`, 5000); }
  }
  S.docBusy = null;
  await Store.set("cands", S.cands); await Store.set("files", S.files);
  render();
}

/* ---------- сводка ---------- */
function monthAgg(mk){
  const per = [], T = {inAmt: 0, inPct: 0, out: 0};
  for (const n of sheetsInOrder()){
    const agg = {inAmt: 0, inPct: 0, out: 0};
    for (const id of S.parsed[n].targets){
      const t = S.targets[id]; if (["bank", "table", "debt"].includes(t.kind)) continue;
      const m = t.months[mk]; if (m){ agg.inAmt += m.inAmt; agg.inPct += m.inPct; agg.out += m.out; }
      for (const op of opsOf(t)) if ((op.values.date || "").startsWith(mk)){ const a = Number(op.values.amt) || 0; if (op.part === "in"){ agg.inAmt += a; agg.inPct += a * (Number(t.kind === "block" ? op.values.pct : op.values.pctT) || 0) / 100; } else agg.out += a; }
    }
    if (agg.inAmt || agg.out){ per.push({n, ...agg}); T.inAmt += agg.inAmt; T.inPct += agg.inPct; T.out += agg.out; }
  }
  return {per, T};
}
function allMonths(){
  const s = new Set(); for (const id of S.order) Object.keys(S.targets[id].months).forEach(k => s.add(k));
  for (const op of S.ops) if (op.values.date) s.add(op.values.date.slice(0, 7));
  return [...s].filter(k => k >= "2024-01" && k <= todayIso().slice(0, 7)).sort();
}
function barChart(months){
  const data = months.map(k => ({k, ...monthAgg(k).T}));
  const mx = Math.max(1, ...data.map(d => Math.max(d.inAmt, d.out)));
  const W = 340, H = 150, padB = 20, bw = W / data.length;
  let g = "";
  data.forEach((d, i) => {
    const x = i * bw, h1 = d.inAmt / mx * (H - padB - 8), h2 = d.out / mx * (H - padB - 8), w = Math.max(4, bw * 0.3);
    const sel = d.k === S.sumMonth;
    g += `<rect x="${(x + bw / 2 - w - 1).toFixed(1)}" y="${(H - padB - h1).toFixed(1)}" width="${w.toFixed(1)}" height="${h1.toFixed(1)}" rx="2" fill="var(--in)" opacity="${sel ? 1 : .55}"/>`;
    g += `<rect x="${(x + bw / 2 + 1).toFixed(1)}" y="${(H - padB - h2).toFixed(1)}" width="${w.toFixed(1)}" height="${h2.toFixed(1)}" rx="2" fill="var(--out)" opacity="${sel ? 1 : .55}"/>`;
    g += `<text x="${(x + bw / 2).toFixed(1)}" y="${H - 5}" text-anchor="middle" ${sel ? 'style="fill:var(--ink);font-weight:600"' : ""}>${MONTHS_S[+d.k.slice(5) - 1]}</text>`;
    g += `<rect x="${x.toFixed(1)}" y="0" width="${bw.toFixed(1)}" height="${H}" fill="transparent" data-act="pickMonth" data-m="${d.k}" style="cursor:pointer"/>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Поступления и выдачи по месяцам">${g}</svg>
    <div class="legend"><span><i style="background:var(--in)"></i>Поступило</span><span><i style="background:var(--out)"></i>Выдано и списано</span></div>`;
}
function viewSummary(v){
  setTitle("Сводка", false);
  const list = allMonths();
  if (!S.sumMonth || !list.includes(S.sumMonth)) S.sumMonth = list[list.length - 1] || todayIso().slice(0, 7);
  const mk = S.sumMonth, idx = list.indexOf(mk);
  const {per, T} = monthAgg(mk);
  const partners = [];
  for (const id of S.order){
    const t = S.targets[id]; if (t.kind !== "block") continue;
    let inA = t.months[mk] ? t.months[mk].inAmt : 0, pc = t.months[mk] ? t.months[mk].inPct : 0;
    for (const op of opsOf(t)) if (op.part === "in" && (op.values.date || "").startsWith(mk)){ const a = Number(op.values.amt) || 0; inA += a; pc += a * (Number(op.values.pct) || 0) / 100; }
    if (inA) partners.push({t, inA, pc});
  }
  partners.sort((a, b) => b.inA - a.inA);
  const bal = S.order.map(id => S.targets[id]).filter(t => !["table", "bank"].includes(t.kind)).map(t => ({t, b: balanceOf(t)})).filter(x => x.b != null && Math.abs(x.b) >= 1).sort((a, b) => Math.abs(b.b) - Math.abs(a.b));
  let html = loadingBlock();
  html += `<div class="panel pad">${barChart(list.slice(-8))}</div>
  <div class="monthbar"><button class="btn sm ghost" data-act="mStep" data-d="-1" ${idx <= 0 ? "disabled" : ""} aria-label="Предыдущий месяц">‹</button><b>${esc(monthTitle(mk))}</b><button class="btn sm ghost" data-act="mStep" data-d="1" ${idx >= list.length - 1 ? "disabled" : ""} aria-label="Следующий месяц">›</button></div>
  <div class="grid2"><div class="tile"><div class="lbl">Поступило</div><div class="v pos">${fmtShort(T.inAmt)}</div></div><div class="tile"><div class="lbl">Выдано и списано</div><div class="v neg">${fmtShort(T.out)}</div></div></div>
  <div class="sec"><span>По листам</span></div><div class="panel scrollx"><table class="sum"><thead><tr><th>Лист</th><th>Поступило</th><th>Сумма %</th><th>Выдано</th></tr></thead><tbody>
  ${per.map(r => `<tr><td>${esc(sheetLabel(r.n))}</td><td>${fmtShort(r.inAmt)}</td><td>${fmtShort(r.inPct)}</td><td>${fmtShort(r.out)}</td></tr>`).join("") || `<tr><td colspan="4" class="muted">За этот месяц записей нет</td></tr>`}
  </tbody></table></div>
  <div class="small muted" style="margin:6px 4px">«Сумма %» — сумма × процент из каждой строки: у покупателей и поставщиков колонка «%», у Континента и транзитов «% транзита». Банковские разделы, долги и выплаты в эти итоги не входят, чтобы не считать деньги дважды.</div>`;
  if (partners.length) html += `<div class="sec"><span>Партнёры месяца по поступлениям</span></div><div class="panel scrollx"><table class="sum"><thead><tr><th>Партнёр</th><th>Поступило</th><th>Сумма %</th></tr></thead><tbody>${partners.slice(0, 12).map(p => `<tr><td><button class="chip" style="border:0;background:none;padding:0;font-size:14px" data-act="openTarget" data-id="${esc(p.t.id)}">${esc(p.t.title)}</button><div class="small muted">${esc(sheetLabel(p.t.sheet))}</div></td><td>${fmtShort(p.inA)}</td><td>${fmtShort(p.pc)}</td></tr>`).join("")}</tbody></table></div>`;
  html += `<div class="sec"><span>Крупнейшие остатки сейчас</span></div><div class="panel">${bal.slice(0, 15).map(x => targetRow(x.t)).join("")}</div>`;
  v.innerHTML = html;
}

/* ---------- файл и настройки ---------- */
function viewFile(v){
  setTitle("Файл", false);
  let html = `<div class="panel pad"><div class="small muted">Рабочая таблица</div><div style="font-weight:600;word-break:break-all">${esc(S.baseName)}</div><div class="small muted">${(S.baseBuf.byteLength / 1048576).toFixed(1)} МБ · листов в работе: ${sheetsInOrder().length}</div></div>`;
  html += `<div class="sec"><span>Не сохранено в файл: ${S.ops.length}</span></div>`;
  if (S.ops.length) html += `<div class="panel">${S.ops.slice().reverse().map(o => { const t = S.targets[o.targetId]; return t ? recRow(t, o, true, true) : ""; }).join("")}</div>`;
  html += `<div class="panel pad"><button class="btn primary wide" data-act="export" ${S.ops.length ? "" : "disabled"}>Сохранить таблицу с новыми записями</button>
    <div class="small muted" style="margin-top:8px">Записи попадут в нужные блоки и строки. Формулы и оформление не меняются, Excel пересчитает итоги при открытии.</div>
    ${S.lastExport ? `<button class="btn ghost wide" style="margin-top:10px" data-act="adopt">Продолжить работу с сохранённым файлом</button><div class="small muted" style="margin-top:6px">Сохранённый файл станет рабочим, список новых записей очистится.</div>` : ""}</div>
  <div class="panel">
    <button class="row" data-act="pickXlsx"><div class="grow"><div class="t">Открыть другую таблицу</div><div class="s">Например, присланную коллегой</div></div><span class="muted">›</span></button>
    <button class="row" data-act="openRules"><div class="grow"><div class="t">Выученные подсказки</div><div class="s">${Object.keys(S.rules).filter(k => !k.includes("|")).length} контрагентов</div></div><span class="muted">›</span></button>
    <div class="row"><div class="grow"><div class="t">Оформление</div></div><div class="seg" style="margin:0;min-width:200px">${[["auto", "Авто"], ["light", "Светлое"], ["dark", "Тёмное"]].map(([k, l]) => `<button data-act="theme" data-v="${k}" aria-pressed="${S.settings.theme === k}">${l}</button>`).join("")}</div></div>
  </div>
  <div class="panel pad small muted">Офлайн-версия ${APP_VERSION}. Данные хранятся только на этом устройстве.<br>Наши реквизиты (из выписок): ${esc((S.settings.ownInn || []).map(i => "ИНН " + i).join(", ") || "пока не определены — загрузите выписку")}</div>`;
  v.innerHTML = html;
}
function viewRules(v){
  setTitle("Выученные подсказки", true);
  const keys = Object.keys(S.rules).filter(k => !k.includes("|") && S.rules[k].length);
  v.innerHTML = keys.length ? `<div class="panel">${keys.map(k => { const r = S.rules[k]; const lbl = r[0].label || k.replace(/^\w+:/, "");
    return `<div class="row"><div class="grow"><div class="t">${esc(lbl)}</div><div class="s">${esc(r.map(x => (S.targets[x.targetId] || {}).title).filter(Boolean).join(" + "))}</div></div><button class="btn sm ghost" data-act="delRule" data-k="${esc(k)}" aria-label="Забыть">Забыть</button></div>`; }).join("")}</div>`
    : `<div class="empty"><p>Подсказки появятся, когда вы запишете первые операции из документов.</p></div>`;
}
function applyTheme(){ const t = S.settings.theme; if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = t; }

/* ================= события ================= */
document.addEventListener("click", async e => {
  const tb = e.target.closest("nav.tabs button");
  if (tb){ S.tab = tb.dataset.tab; S.stack = []; render(); window.scrollTo(0, 0); return; }
  if (e.target.closest("#backBtn")){ S.stack.pop(); S.filter = "all"; S.showN = 40; render(); return; }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act, cand = id => S.cands.find(c => c.id === id);
  switch (act){
    case "pickXlsx": $("#xlsxInput").click(); break;
    case "pickDoc": $("#docInput").click(); break;
    case "goDocs": S.tab = "docs"; S.stack = []; render(); break;
    case "openSheet": S.stack.push({type: "sheet", name: a.dataset.name}); render(); window.scrollTo(0, 0); break;
    case "openTarget": S.stack.push({type: "target", id: a.dataset.id}); S.filter = "all"; S.showN = 40; render(); window.scrollTo(0, 0); break;
    case "openRules": S.stack.push({type: "rules"}); render(); break;
    case "quickNew": openPicker(t => { S.tab = "ledgers"; S.stack = [{type: "target", id: t.id}]; render(); }, null, "Выберите журнал"); break;
    case "pin": { const id = a.dataset.id; const p = S.settings.pins || (S.settings.pins = []); const i = p.indexOf(id); if (i >= 0) p.splice(i, 1); else p.push(id); await Store.set("settings", S.settings); render(); break; }
    case "filter": S.filter = a.dataset.f; S.showN = 40; render(); break;
    case "more": S.showN += 60; render(); break;
    case "newOp": { const t = S.targets[a.dataset.id], part = a.dataset.part, vals = {};
      for (const f of t.parts[part].fields){ if (f.key === "date") vals.date = todayIso(); else if (["pct", "pctT", "rate", "ka", "partner", "company"].includes(f.key)) vals[f.key] = lastValue(t, part, f.key); }
      openForm(t, part, vals); break; }
    case "debtRet": { const t = S.targets[a.dataset.id]; const row = +a.dataset.row; openForm(t, "ret", {}, {row, subNote: "сумма добавится к колонке возврата"}); break; }
    case "editOp": { const op = S.ops.find(o => o.id === a.dataset.id); if (!op) break; const t = S.targets[op.targetId]; openForm(t, op.part, op.values, {op, row: op.row}); break; }
    case "candUse": { const c = cand(a.dataset.id); const t = S.targets[a.dataset.t]; const sg = suggestFor(c).find(s => s.targetId === t.id && s.part === a.dataset.part); useCand(c, t, a.dataset.part, sg); break; }
    case "candPick": { const c = cand(a.dataset.id); openPicker(t => useCand(c, t, c.dir === "out" ? (t.parts.out.fields.length ? "out" : "in") : (t.parts.in.fields.length ? "in" : "out")), null); break; }
    case "candEdit": openCandEdit(cand(a.dataset.id)); break;
    case "candSkip": { const c = cand(a.dataset.id); c.skipped = true; await Store.set("cands", S.cands); render(); break; }
    case "candUnskip": { const c = cand(a.dataset.id); c.skipped = false; await Store.set("cands", S.cands); render(); break; }
    case "clearDone": S.cands = S.cands.filter(c => !c.done && !c.skipped); await Store.set("cands", S.cands); render(); break;
    case "bulk": await bulkWrite(); break;
    case "mStep": { const list = allMonths(); const i = list.indexOf(S.sumMonth); S.sumMonth = list[Math.max(0, Math.min(list.length - 1, i + Number(a.dataset.d)))]; render(); break; }
    case "pickMonth": S.sumMonth = a.dataset.m; render(); break;
    case "delRule": { const k = a.dataset.k; for (const key of Object.keys(S.rules)) if (key === k || key.startsWith(k + "|")) delete S.rules[key]; await Store.set("rules", S.rules); render(); break; }
    case "toggleClaude": S.settings.claudeOk = !S.settings.claudeOk; await Store.set("settings", S.settings); render(); break;
    case "theme": S.settings.theme = a.dataset.v; applyTheme(); await Store.set("settings", S.settings); render(); break;
    case "export": {
      a.disabled = true; a.textContent = "Собираю файл…";
      try{
        const blob = await buildXlsx();
        const name = S.baseName.replace(/\.xlsx$/i, "").replace(/_\d{2}\.\d{2}\.\d{4}$/, "") + "_" + fmtDate(todayIso()) + ".xlsx";
        S.lastExport = {blob, name};
        const r = await saveBlob(blob, name);
        toast(r === "declined" ? "Сохранение отменено" : "Файл сохранён");
      }catch(err){ console.error(err); toast("Не удалось собрать файл: " + err.message, 5000); }
      render(); break; }
    case "adopt": {
      if (!S.lastExport) break;
      if (!(await confirmBox("Продолжить с сохранённым файлом?", "Он станет рабочим, а список новых записей очистится — они уже внутри файла.", "Продолжить"))) break;
      const buf = await S.lastExport.blob.arrayBuffer(), nm = S.lastExport.name;
      S.ops = []; await Store.set("ops", S.ops); S.lastExport = null;
      await adoptBase(buf, nm); break; }
  }
});
$("#xlsxInput").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  if (S.ops.length && !(await confirmBox("Открыть другую таблицу?", `Есть ${S.ops.length} несохранённых записей, они будут потеряны.`, "Открыть"))) return;
  const buf = await f.arrayBuffer();
  S.ops = []; await Store.set("ops", S.ops); S.cands = []; await Store.set("cands", S.cands);
  await adoptBase(buf, f.name);
});
$("#docInput").addEventListener("change", e => { const fs = [...e.target.files]; e.target.value = ""; if (fs.length){ S.tab = "docs"; S.stack = []; handleDocs(fs); } });
async function adoptBase(buf, name){
  try{
    S.baseBuf = buf; S.baseName = name;
    await loadWorkbook(buf);
    await Store.set("base", buf); await Store.set("baseName", name);
    S.stack = [];
    await parseAll();
  }catch(err){ console.error(err); S.zip = null; toast("Не удалось открыть таблицу: " + err.message, 5000); render(); }
}

/* ================= запуск ================= */
if ("serviceWorker" in navigator && location.protocol !== "file:"){
  navigator.serviceWorker.register("sw.js").catch(e => console.warn("sw", e));
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (S.swReloadOk) location.reload(); });
}
(async function init(){
  render();
  try{ if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); }catch{}
  await Store.open();
  S.ops = (await Store.get("ops")) || [];
  S.rules = (await Store.get("rules")) || {};
  S.settings = Object.assign({ownInn: [], ownNames: [], pins: null, theme: "auto", claudeOk: false}, (await Store.get("settings")) || {});
  applyTheme();
  S.cands = (await Store.get("cands")) || [];
  S.files = (await Store.get("files")) || {};
  const buf = await Store.get("base");
  if (buf){
    S.baseBuf = buf; S.baseName = (await Store.get("baseName")) || "таблица.xlsx";
    try{ await loadWorkbook(buf); await parseAll(); }catch(e){ console.error(e); S.zip = null; render(); }
  } else render();
})();
window.__app = {S, buildXlsx, addOp, readDocument, suggestFor, dupsFor, autoPlan, parseCheckLines, tableToOps};
</script>
